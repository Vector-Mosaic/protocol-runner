name: Standalone checks
on:
  workflow_dispatch:
    inputs:
      runtime_bundle:
        description: 'Provide compiled JavaScript for a one-time local live check'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: standalone-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.30.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Build standalone packages
        run: pnpm build
      - name: Focused package checks
        run: pnpm test
      - name: Source workspace lifecycle
        run: python -B -m unittest packages.concurrent_development.test_core
      - name: Lint
        run: pnpm lint
      - name: Reproduce scoped recovery
        run: pnpm demo
      - name: Prepare local runtime JavaScript
        if: inputs.runtime_bundle
        run: tar -czf runtime-js.tar.gz packages/*/dist services/*/dist
      - name: Transfer runtime JavaScript
        if: inputs.runtime_bundle
        uses: actions/upload-artifact@v4
        with:
          name: runtime-js
          path: runtime-js.tar.gz
          retention-days: 1
